[workspace]
authors = ["FreekPols <c.f.j.pols@tudelft.nl>"]
channels = ["conda-forge"]
name = "thermoexperimenten"
platforms = ["win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
read_data = "python read_minisd_write_csv.py"
editor = "jupyter lab"

[dependencies]
jupyterlab = ">=4.6.4,<5"
jupytext = ">=1.19.6,<2"
python = "3.14.*"
mystmd = ">=1.13.0,<2"
numpy = ">=2.5.5,<3"
matplotlib = ">=3.11.2,<4"

[pypi-dependencies]
jupyterlab-myst = ">=2.7.0, <3"
pyserial = ">=3.5, <4"
